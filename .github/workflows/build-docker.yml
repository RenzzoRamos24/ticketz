name: Create and publish multi-arch Docker images (fork PALAZ)

# Adaptado del workflow oficial de ticketz-oss/ticketz — mismos pasos, dos
# cambios: publica bajo el namespace de este fork (RenzzoRamos24), no bajo
# ticketz-oss, y solo dispara sobre ramas/tags propios del patch de PALAZ —
# nunca sobre main, para no confundir el fork con un mirror general de
# upstream (Sistema PALAZ, Principio I, excepción segunda — condición (d):
# fork versionado y aislado).
on:
  push:
    branches:
      - 'palaz/**'
    tags:
      - 'palaz-v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: renzzoramos24/ticketz-backend
  IMAGE_FRONTEND: renzzoramos24/ticketz-frontend

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Get git info and setup version files
        run: |
          cat <<EOT > backend/src/gitinfo.ts
          export const GitInfo = {
              commitHash: "$(git rev-parse --short HEAD)",
              commitTimestamp: "$(date -u -d "$(git log -1 --format=%cI)" +'%Y-%m-%dT%H:%M:%SZ')",
              branchName: "$(git rev-parse --abbrev-ref HEAD)",
              tagName: "$(git describe --tags --abbrev=0 2>/dev/null)",
              buildTimestamp: "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          };
          EOT
          cat <<EOT > frontend/public/gitinfo.json
          {
              "commitHash": "$(git rev-parse --short HEAD)",
              "commitTimestamp": "$(date -u -d "$(git log -1 --format=%cI)" +'%Y-%m-%dT%H:%M:%SZ')",
              "branchName": "$(git rev-parse --abbrev-ref HEAD)",
              "tagName": "$(git describe --tags --abbrev=0 2>/dev/null)",
              "buildTimestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOT

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta Backend
        id: metabackend
        uses: docker/metadata-action@v3
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_BACKEND }}
          labels: |
            org.opencontainers.image.title=ticketz-backend
          tags: |
            type=ref,event=branch
            type=match,pattern=palaz-v(.*),group=1
            type=sha

      - name: Docker meta Frontend
        id: metafrontend
        uses: docker/metadata-action@v3
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_FRONTEND }}
          labels: |
            org.opencontainers.image.title=ticketz-frontend
          tags: |
            type=ref,event=branch
            type=match,pattern=palaz-v(.*),group=1
            type=sha

      - name: Build and push backend Docker image
        id: backend
        uses: docker/build-push-action@v2
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metabackend.outputs.tags }}
          labels: ${{ steps.metabackend.outputs.labels }}
          build-args: TICKETZ_REGISTRY_URL=${{secrets.TICKETZ_REGISTRY_URL}}

      - name: Build and push frontend Docker image
        id: frontend
        uses: docker/build-push-action@v2
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metafrontend.outputs.tags }}
          labels: ${{ steps.metafrontend.outputs.labels }}
